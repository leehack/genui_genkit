name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select checks
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B -m unittest discover -s .github -p "test_select_ci.py"
          python3 .github/select_ci.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        if: steps.changes.outputs.package == 'true'
        run: dart format --output=none --set-exit-if-changed lib test example/main.dart

      - name: Analyze
        if: steps.changes.outputs.package == 'true'
        run: flutter analyze lib test example/main.dart

      - name: Test
        if: steps.changes.outputs.package == 'true'
        run: flutter test

      - name: Publish dry run
        run: flutter pub publish --dry-run

      - name: Install pana
        run: flutter pub global activate pana

      - name: Check pub score floor
        run: flutter pub global run pana . --exit-code-threshold 150

  flutter-example:
    name: Flutter example
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: example/flutter_hybrid_genui

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select checks
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/select_ci.py

      - name: Setup Flutter
        if: steps.changes.outputs.flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.changes.outputs.flutter == 'true'
        run: flutter pub get

      - name: Analyze
        if: steps.changes.outputs.flutter == 'true'
        run: flutter analyze

      - name: Test
        if: steps.changes.outputs.flutter == 'true'
        run: flutter test

  backend-example:
    name: Backend example
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: example/genui_backend_server

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select checks
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/select_ci.py

      - name: Setup Flutter
        if: steps.changes.outputs.backend == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.changes.outputs.backend == 'true'
        run: flutter pub get

      - name: Analyze
        if: steps.changes.outputs.backend == 'true'
        run: dart analyze

      - name: Test
        if: steps.changes.outputs.backend == 'true'
        run: dart test
