name: genui_genkit
description: Build Flutter GenUI sessions backed by Genkit models, remote Genkit flows, and hybrid local/remote AI routes.
version: 0.2.0
repository: https://github.com/leehack/genui_genkit
issue_tracker: https://github.com/leehack/genui_genkit/issues
documentation: https://github.com/leehack/genui_genkit/blob/main/doc/architecture.md

topics:
  - ai
  - flutter
  - generative-ui
  - genkit

environment:
  sdk: ^3.10.7
  flutter: '>=3.38.0'

dependencies:
  a2ui_core: ^0.1.0
  flutter:
    sdk: flutter
  genkit: '>=0.13.2 <0.16.0'
  genui: ^0.10.1
  http: ^1.2.0
  schemantic: '>=0.1.3 <0.3.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
